name: Formatting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "black[jupyter]==24.2.0"
      - run: black --check --diff models preference_dataset
